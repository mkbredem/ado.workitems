---
# ILLUSTRATIVE EXAMPLE: created to show how roles can abstract the Azure DevOps
# REST API. Not tested or verified against a live Azure DevOps organization.
#
# Registers the Azure DevOps Organization credential type in automation controller.
# Authenticate with the CONTROLLER_HOST, CONTROLLER_USERNAME and CONTROLLER_PASSWORD
# (or CONTROLLER_OAUTH_TOKEN) environment variables, or attach a Red Hat Ansible
# Automation Platform credential to the job template that runs this playbook.
- name: Register the Azure DevOps Organization credential type
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    configure_credential_type_file: "{{ playbook_dir }}/../docs/credential_types/azure_devops_organization.yml"
    configure_credential_type_definition: "{{ lookup('ansible.builtin.file', configure_credential_type_file) | from_yaml }}"
  tasks:
    - name: Create or update the credential type
      ansible.controller.credential_type:
        name: "{{ configure_credential_type_definition.name }}"
        description: "{{ configure_credential_type_definition.description }}"
        kind: "{{ configure_credential_type_definition.kind }}"
        inputs: "{{ configure_credential_type_definition.inputs }}"
        injectors: "{{ configure_credential_type_definition.injectors }}"
        state: present
