---
argument_specs:
  main:
    short_description: Create, update or delete many work items
    description:
      - Runs the work_item role once per list entry and collects the results.
      - Equivalent of servicenow.itsm.configuration_item_batch for work items.
      - Returns C(batch_results), a list of C(work_item_result) values.
    options:
      batch_work_items:
        type: list
        elements: dict
        required: true
        description: Work item definitions. Keys are work_item role options without the C(work_item_) prefix.
      batch_project:
        type: str
        description: Default project for entries that do not set C(project).
